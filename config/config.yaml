# Visualización
visualization:
  # Estilos de gráficos
  style: seaborn

  # Paleta de colores
  color_palette: husl

  # DPI para gráficos
  dpi: 300

  # Formato de salida
  format: png

  # Tipos de gráficos a generar
  charts:
    - top_technologies
    - top_companies
    - salary_distribution
    - location_distribution
    - contract_type_distribution
    - experience_level_distribution
    - technology_correlation
    - skills_wordcloud

# Reportes
reports:
  # Formato del reporte: html, pdf, markdown
  format: html

  # Incluir gráficos en el reporte
  include_charts: true

  # Incluir estadísticas detalladas
  detailed_stats: true

  # Generar resumen ejecutivo
  executive_summary: true

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_to_file: true
  log_file: "./data/job_scraper.log"
  log_format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
