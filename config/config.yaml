# Términos de búsqueda
search_terms:
  keywords:
    # Keywords optimizados: solo 3 términos amplios y efectivos
    # Esto evita bloqueos anti-bot y encuentra más ofertas variadas
    - "data scientist"      # Amplio: incluye ML, AI, Analytics
    - "data engineer"       # Infraestructura de datos
    - "machine learning"    # IA y ML específico

  locations:
    - "España"
    - "Remote"

# Almacenamiento de datos
storage:
  # Formato principal de almacenamiento: csv, json, sqlite
  format: csv

  # Guardar también en formato alternativo
  save_json: true
  save_csv: true
  save_sqlite: true

  # Rutas de almacenamiento
  data_dir: "./data"
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  reports_dir: "./data/reports"
  visualizations_dir: "./data/visualizations"

